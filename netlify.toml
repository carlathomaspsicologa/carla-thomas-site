[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  SECRETS_SCAN_OMIT_PATHS = "src/assets/kit-cf052734cbc6.pdf,src/_includes/base.njk,_site/**"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
